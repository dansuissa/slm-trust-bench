[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slm-trust-bench"
version = "0.1.0"
description = "Reproducible measurements of factuality, abstention, and output reliability in small language models"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
authors = [{name = "Dan Suissa"}]
dependencies = []

[project.optional-dependencies]
data = ["openpyxl==3.1.5", "pyarrow==19.0.1"]
cpu = ["torch==2.6.0", "transformers==4.51.3", "accelerate==1.6.0", "tokenizers==0.21.4", "safetensors==0.8.0", "numpy==2.5.4", "psutil==7.2.2"]

[project.scripts]
trustbench = "trustbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
