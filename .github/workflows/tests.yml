name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU runtime
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[cpu,data]'
      - name: Test accounting, recovery, annotation, and data contracts
        run: python -m unittest discover -s tests -v
      - name: Run synthetic accounting check
        run: trustbench smoke --out tmp/accounting
